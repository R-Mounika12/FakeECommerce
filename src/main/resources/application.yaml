spring:
  application:
    name: FakeECommerce
  datasource:
    url: jdbc:mysql://localhost:3306/fakeECommerce
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration/rollout
    baseline-on-migrate: true
    validate-on-migrate: true
